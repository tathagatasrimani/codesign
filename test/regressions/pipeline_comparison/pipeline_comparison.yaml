# Pipeline comparison regression suite
# Direct comparison between ScaleHLS and StreamHLS on the same benchmarks

# GEMM comparison
scalehls_gemm_cmp:
  base_cfg: vitis_test
  args:
    stop_at_checkpoint: pd
    benchmark: gemm
    arch_opt_pipeline: scalehls
    min_dsp: 13

streamhls_gemm_cmp:
  base_cfg: vitis_test
  args:
    stop_at_checkpoint: pd
    benchmark: gemm
    arch_opt_pipeline: streamhls
    pytorch: True
    min_dsp: 13

