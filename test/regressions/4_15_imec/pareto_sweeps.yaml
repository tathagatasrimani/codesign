reg_vitis_test_sweep_bayesian:
  base_cfg: vitis_test_sweep
  args:
    model_cfg: sweep_basic_cfg
    fixed_area_increase_pattern: True
    solver: bayesian

reg_vitis_test_sweep_bayesian_opt_1:
  base_cfg: vitis_test_sweep_bayesian
  args:
    streamhls_opt_level: 1

reg_vitis_test_sweep_bayesian_opt_1_independent:
  base_cfg: vitis_test_sweep_bayesian
  args:
    streamhls_opt_level: 1
    mem_grouping: independent

reg_vitis_test_sweep_bayesian_opt_1_independent_edram:
  base_cfg: vitis_test_sweep_bayesian
  args:
    streamhls_opt_level: 1
    mem_grouping: independent
