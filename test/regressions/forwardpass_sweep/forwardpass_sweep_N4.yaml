benchmark_3mm_sweep_test_N4:
  base_cfg: vitis_test
  args:
    benchmark: kernel_3mm
    stop_at_checkpoint: pd
    tech_node: yarch-default
    workload_size: 4
    checkpoint_load_dir: forwardpass_sweep_N4/3mm/
    checkpoint_start_step: schedule
    use_hierarchical_placer: true

