# StreamHLS pipeline variations tests
# Tests StreamHLS with different configurations and parameters

# GEMM variations
streamhls_gemm_pytorch:
  base_cfg: vitis_test
  args:
    stop_at_checkpoint: pd
    benchmark: gemm
    arch_opt_pipeline: streamhls
    pytorch: True
    min_dsp: 13

streamhls_gemm_pytorch_higher_dsp:
  base_cfg: vitis_test
  args:
    stop_at_checkpoint: pd
    benchmark: gemm
    arch_opt_pipeline: streamhls
    pytorch: True
    min_dsp: 50

